name: Test runner
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - name: No new JavaScript files in src/
        if: github.event_name == 'pull_request'
        run: |
          ADDED=$(git diff --name-only --diff-filter=AR \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} \
            | grep -E '^src/.*\.jsx?$' || true)
          if [ -n "$ADDED" ]; then
            echo "::error::New .js files are not allowed in src/. This repo is migrating to TypeScript."
            echo "$ADDED"
            exit 1
          fi
          echo "No new .js files in src/."
      - run: npm run lint
      - run: npm run type-check
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: npm run ci:verify
      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage/coverage-final.json,./coverage-jest/coverage-final.json,./coverage-cypress/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: npm run build
  validate_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci
      - name: Build with JSDoc
        run: npm run docs

name: Generate and Release Documentation

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Build with JSDoc
        run: npm run docs
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/api
          cp -r docs/* deploy/api/
      - name: Deploy to gh-pages
        run: |
          set -euo pipefail

          if [ ! -d deploy/api ] || [ -z "$(find deploy/api -type f | head -1)" ]; then
            echo "::error::No docs files found in deploy/api"
            exit 1
          fi

          # Build FileAddition payloads on disk. Passing multi-MB base64 through
          # jq --arg/--argjson hits ARG_MAX ("Argument list too long") on the
          # larger JSDoc assets (e.g. app.min.js). --rawfile/--slurpfile keep
          # large blobs out of argv.
          #
          # Only api/ is updated so metrics and other gh-pages content
          # (data.json, index.html, etc.) are left alone.
          WORKDIR=$(mktemp -d)
          ADDITIONS_NDJSON="$WORKDIR/additions.ndjson"
          ADDITIONS_JSON="$WORKDIR/additions.json"
          VARIABLES_JSON="$WORKDIR/variables.json"
          REQUEST_JSON="$WORKDIR/request.json"
          : > "$ADDITIONS_NDJSON"

          while IFS= read -r -d '' f; do
            rel="${f#deploy/}"
            b64=$(mktemp "$WORKDIR/b64.XXXXXX")
            # FileAddition.contents must be RFC 4648 base64 (GitHub decodes
            # when creating the blob).
            base64 -w0 "$f" > "$b64"
            jq -n --arg path "$rel" --rawfile contents "$b64" \
              '{path: $path, contents: $contents}' >> "$ADDITIONS_NDJSON"
          done < <(find deploy/api -type f -print0 | sort -z)

          jq -s '.' "$ADDITIONS_NDJSON" > "$ADDITIONS_JSON"
          FILE_COUNT=$(jq 'length' "$ADDITIONS_JSON")
          echo "Preparing to update $FILE_COUNT file(s) under api/ on gh-pages"

          # createCommitOnBranch produces a GitHub-signed (verified) commit.
          # The org ruleset requires signed commits; peaceiris/actions-gh-pages
          # did a plain git push of an unsigned bot commit and was rejected (GH013).
          for attempt in 1 2 3; do
            BRANCH_SHA=$(gh api "repos/$REPO/git/ref/heads/gh-pages" --jq '.object.sha' 2>/dev/null || echo "")
            if [ -z "$BRANCH_SHA" ]; then
              echo "::error::gh-pages branch not found. Create it once with a verified commit, then re-run."
              exit 1
            fi

            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            jq -n \
                --arg repo "$REPO" \
                --arg oid "$BRANCH_SHA" \
                --arg msg "docs: update API documentation ($SHORT_SHA)" \
                --slurpfile additions "$ADDITIONS_JSON" \
                '{input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: "gh-pages"},
                  message: {headline: $msg},
                  fileChanges: {additions: $additions[0]},
                  expectedHeadOid: $oid
                }}' > "$VARIABLES_JSON"

            # gh api graphql treats each -f field as an individual GraphQL
            # variable, so the payload must be sent as a full request body
            # via --input. Success is decided by the returned commit oid —
            # a failed mutation can come back as GraphQL errors with HTTP 200.
            COMMIT_OID=""
            jq -n \
                --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
                --slurpfile variables "$VARIABLES_JSON" \
                '{query: $query, variables: $variables[0]}' > "$REQUEST_JSON"

            if output=$(gh api graphql --input "$REQUEST_JSON" 2>&1); then
              COMMIT_OID=$(printf '%s' "$output" \
                | jq -r '.data.createCommitOnBranch.commit.oid // empty' 2>/dev/null || true)
            fi

            if [ -n "$COMMIT_OID" ]; then
              echo "Pushed verified commit $COMMIT_OID to gh-pages"
              exit 0
            fi

            echo "Attempt $attempt failed: $output"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to push to gh-pages after 3 attempts. Last error: $output"
              exit 1
            fi
            sleep 3
          done
